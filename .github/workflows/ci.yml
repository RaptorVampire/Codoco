# =============================================================================
#  Codoco -- Continuous Integration
#  https://github.com/RaptorVampire/Codoco
# =============================================================================
name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_COLOR: "1"
  CI: "true"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux / gcc",         os: ubuntu-latest,  cc: gcc,   slug: linux-gcc }
          - { name: "Linux / clang",       os: ubuntu-latest,  cc: clang, slug: linux-clang }
          - { name: "Linux / gcc + ASan",  os: ubuntu-latest,  cc: gcc,   slug: linux-asan, sanitize: "address,undefined" }
          - { name: "macOS / clang",       os: macos-latest,   cc: clang, slug: macos-clang }
          - { name: "Windows / mingw-w64", os: windows-latest, cc: gcc,   slug: windows-mingw }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      #  Create the logs dir early so every step can write into it
      # ---------------------------------------------------------------------
      - name: Prepare logs directory
        shell: bash
        run: mkdir -p logs

      # ---------------------------------------------------------------------
      #  Diagnostics
      # ---------------------------------------------------------------------
      - name: Diagnostic (Unix)
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          {
            echo "======== runner ========"
            uname -a
            echo "OS:   ${{ runner.os }}  Arch: ${{ runner.arch }}"
            echo
            echo "======== tools ========"
            for t in make cc gcc clang sed awk grep tar install strip unzip curl; do
              if command -v "$t" >/dev/null 2>&1; then
                printf '  %-10s %s\n' "$t" "$(command -v "$t")"
              else
                printf '  %-10s MISSING\n' "$t"
              fi
            done
            echo
            echo "======== cpu count ========"
            (command -v nproc    >/dev/null 2>&1 && echo "nproc: $(nproc)")    || true
            (command -v getconf  >/dev/null 2>&1 && echo "getconf: $(getconf _NPROCESSORS_ONLN)") || true
            (command -v sysctl   >/dev/null 2>&1 && echo "sysctl: $(sysctl -n hw.ncpu 2>/dev/null)") || true
            echo
            echo "======== compiler ========"
            ${{ matrix.cc }} --version 2>&1 | head -3 || true
            echo
            echo "======== repo ========"
            ls -la
            ls -la src/ include/ 2>/dev/null || true
          } 2>&1 | tee logs/00-diagnostic.txt

      # ---------------------------------------------------------------------
      #  Install extra tools
      # ---------------------------------------------------------------------
      - name: Install extra tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
                cppcheck valgrind build-essential
          } 2>&1 | tee logs/01-install.txt

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make

      # ---------------------------------------------------------------------
      #  Build
      # ---------------------------------------------------------------------
      - name: Install GNU Make 4.x (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS ships GNU Make 3.81, which has bugs with certain
          # $(shell) escapes. Install a modern version from Homebrew.
          brew install make
          echo "make version: $(gmake --version | head -1)"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set +e
          {
            set -x
            NPROC=$( (command -v nproc   >/dev/null 2>&1 && nproc) \
                  || (getconf _NPROCESSORS_ONLN 2>/dev/null) \
                  || (sysctl -n hw.ncpu 2>/dev/null) \
                  || echo 2 )
            echo "Using -j${NPROC}"
            MAKE=make
            [ "$(uname -s)" = "Darwin" ] && MAKE=gmake
            echo "using: $MAKE ($($MAKE --version | head -1))"

            make clean || true

            if [ -n "${{ matrix.sanitize }}" ]; then
              $MAKE -j"$NPROC" \
                  CC="$CC" \
                  OPT="-O1 -g3" \
                  EXTRA_CFLAGS="-fsanitize=${{ matrix.sanitize }} -fno-omit-frame-pointer" \
                  EXTRA_LDFLAGS="-fsanitize=${{ matrix.sanitize }}" \
                  all
            else
              $MAKE -j"$NPROC" CC="$CC" all
            fi
            RC=$?
            set +x
            echo
            echo "build exit code: $RC"
            echo
            echo "======== binary ========"
            ls -la ./codoco 2>&1 || true
            file ./codoco 2>&1 || true
            echo
            echo "======== binary perms ========"
            stat ./codoco 2>&1 || true
            exit $RC
          } 2>&1 | tee logs/02-build.txt
          exit "${PIPESTATUS[0]}"


      - name: Windows diagnostics
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "=== uname ==="
          uname -a || true
          echo "=== gcc ==="
          gcc --version | head -1 || true
          echo "=== make ==="
          make --version | head -1 || true
          echo "=== nproc ==="
          nproc || echo "nproc missing"
          echo "=== files ==="
          ls -la
          ls -la src/ include/ || true

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          {
            echo "======== preconditions ========"
            BIN="$PWD/codoco"
            test -f "$BIN"      || { echo "::error::binary missing: $BIN"; exit 10; }
            test -x "$BIN"      || { echo "::error::binary not executable"; exit 11; }
            ls -la "$BIN"
            file "$BIN" 2>&1 || true
            echo "OK: binary exists and is executable"
            echo

            echo "======== 1/5 --version ========"
            "$BIN" --version; echo "exit: $?"
            echo

            echo "======== 2/5 --help ========"
            "$BIN" --help > /dev/null; echo "exit: $?"
            echo

            echo "======== 3/5 table ========"
            "$BIN" --no-color --ascii --no-bar . > /dev/null; echo "exit: $?"
            echo

            echo "======== 4/5 json ========"
            "$BIN" --json --by-file . > /dev/null; echo "exit: $?"
            echo

            echo "======== 5/5 html ========"
            BASE_OUT="${RUNNER_TEMP:-/tmp}/codoco-report.html"
            "$BIN" --html -o "$BASE_OUT" .
            rc=$?
            echo "exit: $rc"
            if [ "$rc" -ne 0 ]; then
                echo "::error::--html command failed (exit $rc)"
                exit 1
            fi
            DARK="${BASE_OUT%.html}-dark.html"
            LIGHT="${BASE_OUT%.html}-light.html"
            if [ -s "$DARK" ] && [ -s "$LIGHT" ]; then
                echo "OK: dark=$(wc -c <"$DARK") light=$(wc -c <"$LIGHT") bytes"
            else
                echo "::error::report missing (dark=$DARK light=$LIGHT)"
                exit 1
            fi
          } 2>&1 | tee logs/03-smoketest.txt
          exit "${PIPESTATUS[0]}"

      - name: cppcheck (Linux/gcc only)
        if: runner.os == 'Linux' && matrix.cc == 'gcc' && !matrix.sanitize
        shell: bash
        run: |
          {
            cppcheck --enable=warning,performance,portability \
                     --suppress=missingIncludeSystem \
                     --error-exitcode=1 \
                     -Iinclude src/
          } 2>&1 | tee logs/04-cppcheck.txt
          exit "${PIPESTATUS[0]}"

      - name: Valgrind memcheck (Linux/gcc only)
        if: runner.os == 'Linux' && matrix.cc == 'gcc' && !matrix.sanitize
        shell: bash
        run: |
          {
            NPROC=$(nproc 2>/dev/null || echo 2)
            make clean
            make -j"$NPROC" all
            valgrind --error-exitcode=1 --leak-check=full \
                     ./codoco --no-color --ascii . > /dev/null
          } 2>&1 | tee logs/05-valgrind.txt
          exit "${PIPESTATUS[0]}"

      # ---------------------------------------------------------------------
      #  Upload logs and binary -- always, even on failure
      # ---------------------------------------------------------------------
      - name: Build (Windows / MinGW)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          mkdir -p logs
          {
            echo "=== uname ==="
            uname -a
            echo "=== pwd ==="
            pwd
            echo "=== ls ==="
            ls -la
            echo "=== tools ==="
            for t in gcc make awk sed grep tar strip install; do
              command -v "$t" && "$t" --version 2>&1 | head -1
            done
            echo "=== nproc ==="
            nproc 2>/dev/null || echo "no nproc"
            echo "=== version.h ==="
            cat include/version.h
            echo "=== make dry-run ==="
            make -n all 2>&1 || true
            echo "=== real build ==="
            NPROC=$(nproc 2>/dev/null || echo 2)
            make clean 2>&1 || true
            make -j"$NPROC" all 2>&1
            echo "=== result ==="
            ls -la ./codoco.exe 2>&1 || ls -la ./codoco 2>&1 || true
            file ./codoco.exe 2>&1 || true
          } 2>&1 | tee logs/02-build.txt
          ls -la ./codoco.exe || ls -la ./codoco

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          BIN=./codoco.exe
          [ -f "$BIN" ] || BIN=./codoco
          {
            echo "======== preconditions ========"
            ls -la "$BIN"
            echo
            echo "======== 1/3 --version ========"
            "$BIN" --version; echo "exit: $?"
            echo
            echo "======== 2/3 --help ========"
            "$BIN" --help > /dev/null; echo "exit: $?"
            echo
            echo "======== 3/3 table ========"
            "$BIN" --no-color --ascii --no-bar . > /dev/null; echo "exit: $?"
            echo
            echo "all smoke tests passed"
          } 2>&1 | tee logs/03-smoketest.txt

      - name: Upload logs and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.slug }}-logs
          path: |
            logs/
            codoco
            codoco.exe
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace and tabs
        shell: bash
        run: |
          set +e
          FAIL=0

          echo "---- trailing whitespace in source files ----"
          git grep -nE '[ 	]+$' -- '*.c' '*.h' 'Makefile' 2>/dev/null
          if [ $? -eq 0 ]; then
              echo "::error::trailing whitespace found (see lines above)"
              FAIL=1
          else
              echo "clean"
          fi

          echo
          echo "---- tab characters in C sources ----"
          git grep -nP '	' -- '*.c' '*.h' 2>/dev/null
          if [ $? -eq 0 ]; then
              echo "::error::tab character in C source (see lines above)"
              FAIL=1
          else
              echo "clean"
          fi

          exit $FAIL
  no-warnings:
    name: Build with -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with -Werror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs

          if [ "$(uname -s)" = "Darwin" ]; then
              MAKE=gmake
          else
              MAKE=make
          fi
          export MAKE

          NPROC=$( (command -v nproc   >/dev/null 2>&1 && nproc) \
                || (getconf _NPROCESSORS_ONLN 2>/dev/null) \
                || (sysctl -n hw.ncpu 2>/dev/null) \
                || echo 2 )
          echo "using: $MAKE, -j$NPROC"

          {
            "$MAKE" clean || true
            "$MAKE" -j"$NPROC" EXTRA_CFLAGS="-Werror" all
            ./codoco --version
          } 2>&1 | tee logs/werror.txt

      - name: Upload werror logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-werror-logs
          path: logs/
          retention-days: 14
